{% extends 'Zehnify/base.html' %}

{% block title %}Log In | Zehnify{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        
        <!-- Brand & Page Header -->
        <div class="auth-header">
            <span class="auth-subtitle">Welcome Back</span>
            <h1 class="auth-title">Log In</h1>
            <p class="auth-description">Enter your credentials to access your dashboard.</p>
        </div>

        <!-- Login Form -->
        <form method="post" class="auth-form">
            {% csrf_token %}
            
            <div class="form-fields">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <!-- Footer Navigation Link -->
        <div class="auth-footer-link">
            <p>Don't have an account? <a href="{% url 'signup_page' %}">Register yourself</a></p>
        </div>

    </div>
</div>
{% endblock %}
